[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-eq"
version = "0.1.0"
description = "NeurIPS 2026 Fusion Equilibrium Challenge - ksalango"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fusion_eq = ["resources/*.json"]
